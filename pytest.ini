[pytest]
testpaths = tests
python_files = test_*.py *_test.py testing_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --ignore=tests/device_servers/cameras/avantes/avaspec_test.py
    --ignore=tests/device_servers/cameras/avantes/test_parallel_readout.py
    --ignore=tests/device_servers/motion/standa/standa_test.py
    --ignore=tests/device_servers/motion/standa/testing_STANDA.py
    --ignore=tests/device_servers/motion/owis/testing_OWIS.py
    --ignore=tests/device_servers/testing/Denis_test.py
    --ignore=tests/device_servers/test_network_timing.py
    --ignore=tests/device_servers/test_tango_db_performance.py
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    device_server: marks tests as device server tests
    gui: marks tests as GUI tests
    netio: marks tests as NetIO related
    utilities: marks tests as utility tests
    legacy: marks tests as legacy tests
