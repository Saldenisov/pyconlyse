[pytest]
testpaths = tests
python_files = test_*.py *_test.py testing_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-config
    --strict-markers
    --disable-warnings
    --ignore=tests/manual
    --ignore=tests/integration
    --ignore=tests/legacy
    --ignore=tests/main_app
    --ignore=tests/utilities
markers =
    manual: direct hardware or operator probe; never part of software gate
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    device_server: marks tests as device server tests
    gui: marks tests as GUI tests
    netio: marks tests as NetIO related
    utilities: marks tests as utility tests
    legacy: marks tests as legacy tests
