# omniORB client configuration for faster Tango DB calls
# Timeouts in milliseconds
clientCallTimeoutPeriod = 3000

# Disable bootstrap agent to avoid unnecessary local lookups
supportBootstrapAgent = 0

# NameService should point at your Tango DB host:port
# Previously this was set to 127.0.0.1:10000 which caused timeouts when DB is remote.
# Set this to the same host:port as TANGO_HOST.
ORBInitRef NameService = corbaloc:iiop:10.20.30.202:10000/NameService
