<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SCADA-like Layout Example</title>
  <style>
    /* Container that holds everything in three columns */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr; /* Three equal columns */
      gap: 20px;
      max-width: 1200px;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }

    /* Left Column */
    .left-column .block {
      margin-bottom: 20px;
      padding: 10px;
      text-align: center;
      border: 1px solid #999;
    }
    .left-column .block.red {
      background-color: #cc0000;
      color: #fff;
      font-weight: bold;
    }
    .left-column .block.gray {
      background-color: #f0f0f0;
    }
    .left-column button {
      margin: 5px;
      padding: 8px 16px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    /* Middle Column */
    .middle-column .block {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #999;
      background-color: #f0f0f0;
      text-align: center;
    }
    .middle-column .controls {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
    }
    .middle-column .controls button {
      padding: 6px 10px;
      cursor: pointer;
    }
    .middle-column .controls span {
      min-width: 50px;
      display: inline-block;
      text-align: center;
      font-weight: bold;
    }

    /* Right Column */
    .right-column .block {
      margin-bottom: 20px;
      padding: 10px;
      border: 1px solid #999;
      text-align: center;
    }
    .right-column .block.green {
      background-color: #0a9a0a;
      color: #fff;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Left Column -->
  <div class="left-column">
    <div class="block red">
      ALIMENTATION HT EN MARCHE
    </div>
    <div class="block gray">
      <p>Alimentation HT</p>
      <p>Mesure VHF: 0.0 kV</p>
      <p>Mesure IHF: 0.0 A</p>
    </div>
    <div class="block">
      <button>Démarrage alimentation HT</button>
      <div style="margin-top:10px;">
        <button>MARCHE</button>
        <button>ARRET</button>
      </div>
    </div>
  </div>

  <!-- Middle Column -->
  <div class="middle-column">
    <div class="block">
      <h3>Préamplificateur HF</h3>
      <p>240 g / 400 W</p>
      <div class="controls">
        <button>&laquo;</button>
        <span>360 W</span>
        <button>&raquo;</button>
      </div>
    </div>

    <div class="block">
      <h3>Consigne HV</h3>
      <div class="controls">
        <button>&laquo;</button>
        <span>6.5 kV</span>
        <button>&raquo;</button>
      </div>
    </div>
  </div>

  <!-- Right Column -->
  <div class="right-column">
    <div class="block">
      <h3>Radioprotection coupure HT</h3>
      <p style="margin-top: 10px;">Coupure active</p>
    </div>

    <div class="block green">
      <p>SECTION</p>
      <p>-6.36e+10 μA</p>
    </div>

    <!-- "Impulsions modulateur" moved here -->
    <div class="block">
      <h3>Impulsions modulateur</h3>
      <button>MARCHE</button>
      <button>ARRET</button>
    </div>
  </div>
</div>

</body>
</html>
