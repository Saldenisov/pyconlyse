<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Synchronization Layout (All in µs)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f0f0f0;
    }

    /* Main container with two columns */
    .container {
      display: flex;
      gap: 40px; /* space between columns */
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Each column block */
    .column {
      flex: 1;
      background-color: #ddd;
      padding: 20px;
      border: 1px solid #999;
    }

    .column h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1rem;
      text-transform: uppercase;
    }

    /* Row that contains label + input + unit */
    .control-row {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      padding: 4px;
    }

    .control-row label {
      width: 170px;      /* space for the label */
      font-weight: bold;
      margin-right: 10px;
    }

    .control-row input {
      width: 80px;       /* width of the input field */
      margin-right: 5px; /* space between input and unit */
      text-align: right;
    }

    .control-row span {
      margin-right: 10px;
    }

    /* Highlight certain rows in green */
    .highlight {
      background-color: #afffa7; /* light green */
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Left Column -->
  <div class="column">
    <h2>Synchronisation Carte (Gauche)</h2>

    <!-- Délais NI6071E -->
    <div class="control-row highlight">
      <label for="delai-ni6071e">Délais NI6071E:</label>
      <input type="text" id="delai-ni6071e" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Largeur NI6071E -->
    <div class="control-row highlight">
      <label for="largeur-ni6071e">Largeur NI6071E:</label>
      <input type="text" id="largeur-ni6071e" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Fréquence ELYSE (changed to µs) -->
    <div class="control-row">
      <label for="freq-elyse1">Fréquence ELYSE:</label>
      <input type="text" id="freq-elyse1" placeholder="0.0" />
      <span>µs</span>
    </div>
    <div class="control-row">
      <label for="freq-elyse2">Fréquence ELYSE:</label>
      <input type="text" id="freq-elyse2" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Délais Faraday -->
    <div class="control-row">
      <label for="delai-faraday">Délais Faraday:</label>
      <input type="text" id="delai-faraday" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Largeur Faraday -->
    <div class="control-row">
      <label for="largeur-faraday">Largeur Faraday:</label>
      <input type="text" id="largeur-faraday" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Délais WCM -->
    <div class="control-row">
      <label for="delai-wcm">Délais WCM:</label>
      <input type="text" id="delai-wcm" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Largeur WCM -->
    <div class="control-row">
      <label for="largeur-wcm">Largeur WCM:</label>
      <input type="text" id="largeur-wcm" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Délais Modulateur -->
    <div class="control-row highlight">
      <label for="delai-modulateur">Délais Modulateur:</label>
      <input type="text" id="delai-modulateur" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Largeur Modulateur -->
    <div class="control-row highlight">
      <label for="largeur-modulateur">Largeur Modulateur:</label>
      <input type="text" id="largeur-modulateur" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Synchro 50Hz@20MHz (changed to µs) -->
    <div class="control-row">
      <label for="synchro-left1">Synchro 50Hz@20MHz:</label>
      <input type="text" id="synchro-left1" placeholder="0.0" />
      <span>µs</span>
    </div>
    <div class="control-row">
      <label for="synchro-left2">Synchro 50Hz@20MHz:</label>
      <input type="text" id="synchro-left2" placeholder="0.0" />
      <span>µs</span>
    </div>
  </div>

  <!-- Right Column -->
  <div class="column">
    <h2>Synchronisation Carte (Droite)</h2>

    <!-- Délais LASER/HF -->
    <div class="control-row">
      <label for="delai-laser-hf">Délais LASER/HF:</label>
      <input type="text" id="delai-laser-hf" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Largeur LASER/HF -->
    <div class="control-row">
      <label for="largeur-laser-hf">Largeur LASER/HF:</label>
      <input type="text" id="largeur-laser-hf" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Délais IMAC -->
    <div class="control-row">
      <label for="delai-imac">Délais IMAC:</label>
      <input type="text" id="delai-imac" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Largeur IMAC -->
    <div class="control-row">
      <label for="largeur-imac">Largeur IMAC:</label>
      <input type="text" id="largeur-imac" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Délais Oscilloscope 1 -->
    <div class="control-row">
      <label for="delai-osc1">Délais Oscilloscope 1:</label>
      <input type="text" id="delai-osc1" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Largeur Oscilloscope 1 -->
    <div class="control-row">
      <label for="largeur-osc1">Largeur Oscilloscope 1:</label>
      <input type="text" id="largeur-osc1" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Délais Oscilloscope 2 -->
    <div class="control-row">
      <label for="delai-osc2">Délais Oscilloscope 2:</label>
      <input type="text" id="delai-osc2" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Largeur Oscilloscope 2 -->
    <div class="control-row">
      <label for="largeur-osc2">Largeur Oscilloscope 2:</label>
      <input type="text" id="largeur-osc2" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Délais Détection 1 -->
    <div class="control-row">
      <label for="delai-detection1">Délais Détection 1:</label>
      <input type="text" id="delai-detection1" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Largeur Détection 1 -->
    <div class="control-row">
      <label for="largeur-detection1">Largeur Détection 1:</label>
      <input type="text" id="largeur-detection1" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Délais Machine -->
    <div class="control-row">
      <label for="delai-machine">Délais Machine:</label>
      <input type="text" id="delai-machine" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Largeur Machine -->
    <div class="control-row">
      <label for="largeur-machine">Largeur Machine:</label>
      <input type="text" id="largeur-machine" placeholder="0.0" />
      <span>µs</span>
    </div>

    <!-- Synchro 50Hz@20MHz (changed to µs) -->
    <div class="control-row">
      <label for="synchro-right1">Synchro 50Hz@20MHz:</label>
      <input type="text" id="synchro-right1" placeholder="0.0" />
      <span>µs</span>
    </div>
    <div class="control-row">
      <label for="synchro-right2">Synchro 50Hz@20MHz:</label>
      <input type="text" id="synchro-right2" placeholder="0.0" />
      <span>µs</span>
    </div>

  </div>
</div>

</body>
</html>
