{% extends "base.html" %}

{% block title %}Tango - Pyconlyse Project{% endblock %}

{% block content %}
<h1>Tango Page</h1>
<p>This page displays the status of the Tango Database and Tango starter devices.</p>
<div class="container">
    <div class="row">
        <div class="column">
            <h2>Tango Database Status</h2>
            <div id="tango-db-status" class="lamp"></div>
            <p id="tango-db-downtime"></p>
        </div>
        <div class="column">
            <h2>Tango Starter Device Statuses</h2>
            <div id="tango-statuses">
                <!-- Statuses will be dynamically inserted here -->
            </div>
        </div>
    </div>
</div>

<style>
.container {
    display: flex;
    justify-content: center;
    align-items: center; /* Center items vertically */
    min-height: 100vh; /* Full viewport height */
}
.row {
    display: flex;
    justify-content: center; /* Center columns horizontally */
    align-items: center; /* Center columns vertically */
    width: 100%;
}
.column {
    flex: 1;
    padding: 10px;
    display: flex;
    flex-direction: column;
    align-items: center; /* Center items horizontally within column */
    text-align: center; /* Center text within column */
}
.lamp {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: inline-block;
    background-color: gray; /* Default color (unknown state) */
}
.lamp.green {
    background-color: green;
}
.lamp.red {
    background-color: red;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    function updateStatuses() {
        fetch("{{ url_for('routes.tango_status') }}")
            .then(response => response.json())
            .then(data => {
                // Update Tango Database LED indicator (using data.mysql_status)
                const dbStatusElem = document.getElementById('tango-db-status');
                if (dbStatusElem) {
                    dbStatusElem.className = 'lamp ' + (data.mysql_status ? 'green' : 'red');
                }

                // Update Tango Database downtime text
                const dbDowntimeElem = document.getElementById('tango-db-downtime');
                if (dbDowntimeElem) {
                    if (!data.mysql_status) {
                        dbDowntimeElem.textContent = 'Down for ' + data.mysql_downtime_seconds + ' seconds';
                    } else {
                        dbDowntimeElem.textContent = 'Tango DB is running';
                    }
                }

                // Update Tango starter devices statuses
                const tangoStatuses = document.getElementById('tango-statuses');
                if (tangoStatuses) {
                    tangoStatuses.innerHTML = ''; // Clear old statuses
                    data.tango_statuses.forEach(starter => {
                        const starterDiv = document.createElement('div');
                        starterDiv.innerHTML = `<span>${starter[0]} (${starter[1]})</span>
                                                <div class="lamp ${starter[2] ? 'green' : 'red'}"></div>
                                                ${starter[2] ? '' : `<p>Down for ${starter[3]} seconds</p>`}`;
                        tangoStatuses.appendChild(starterDiv);
                    });
                }
            })
            .catch(error => {
                console.error("Error fetching Tango status:", error);
                const dbStatusElem = document.getElementById('tango-db-status');
                if (dbStatusElem) dbStatusElem.className = 'lamp red';
                const dbDowntimeElem = document.getElementById('tango-db-downtime');
                if (dbDowntimeElem) dbDowntimeElem.textContent = 'Error checking Tango DB';
            });
    }

    // Update statuses every 500ms
    setInterval(updateStatuses, 500);

    // Initial update when the page loads
    updateStatuses();
});
</script>
{% endblock %}
