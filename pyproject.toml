[tool.poetry]
name = "pyconlyse"
version = "0.2.0"
description = "This is PYCONLYSE tango based application for controlling ELYSE experiment."
authors = ["saldenisov <saldenisov@gmail.com>"]
license = "MIT License"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
matplotlib = "^3"
configobj = "^5"
colorcet = "^3"
gpiozero = "^2"
pigpio = "^1"
ifaddr = "^0.2"
imutils = "^0.5"
imageio = "^2"
msgpack = "^1"
msl-loadlib = "^0"
lxml = "^4.9"
keyboard = "^0.13"
opencv-python = "^4"
pandas = "^2"
pyqtgraph = "^0.13"
PyQt5 = "^5"
PyQt5-Qt5 = "5.15.2"
pyqtwebengine-qt5 = "5.15.2"
PyQt5-sip = "^12"
pyepics = "^3"
pypylon = "^3"
pyserial = "^3"
PyTango = "^9"
requests = "^2"
scipy = "^1"
taurus = "^5"
taurus_pyqtgraph = "^0.7"
spyder = "^5.4"
simple-pid = "^2"
vitables = "^3"
QtPy = "^2"
Pillow = "^10"
pyarrow = "^14"
h5py = "^3"
msl-package-manager = "^2"






[tool.poetry.group.dev.dependencies]
pre-commit = "^4.3.0"
black = "^25.1.0"
isort = "^6.0.1"
ruff = "^0.13.0"
mypy = "^1.18.1"
bandit = "^1.8.6"

# Tool configurations
[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["pyconlyse"]

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F", "W", "C90", "I", "N", "D", "UP", "YTT", "ANN", "S", "BLE", "FBT", "B", "A", "COM", "C4", "DTZ", "T10", "DJ", "EM", "EXE", "ISC", "ICN", "G", "INP", "PIE", "T20", "PYI", "PT", "Q", "RSE", "RET", "SLF", "SIM", "TID", "TCH", "INT", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "NPY", "AIR", "PERF", "FURB", "LOG", "RUF"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", # Missing docstrings
    "ANN101", "ANN102", "ANN401", # Type annotation issues
    "S101", # Use of assert
    "PT009", # Use of unittest-style assertions
    "COM812", "ISC001", # Conflicts with formatter
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Same as Black.
line-length = 88

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.9
target-version = "py39"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "S106", "S105"]
"**/test_*.py" = ["S101", "PLR2004", "S106", "S105"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true

[tool.bandit]
skips = ["B101", "B601"]
exclude_dirs = ["tests", "test"]

[tool.pydocstyle]
convention = "numpy"
add-ignore = ["D100", "D104", "D105", "D107"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
