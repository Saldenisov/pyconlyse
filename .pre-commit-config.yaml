# Simplified pre-commit configuration for local development
repos:
  # Local tools (using poetry environment)
  - repo: local
    hooks:
      # Black formatting
      - id: black
        name: black
        entry: poetry run black
        language: system
        files: \.py$
        args: [--line-length=88]
        
      # Ruff linting
      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check
        language: system
        files: \.py$
        args: [--fix, --exit-non-zero-on-fix]
        
      # Ruff formatting
      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        files: \.py$
        
      # Import sorting
      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        files: \.py$
        args: [--profile=black, --line-length=88]
        
      # WARP maintenance auto-update
      - id: warp-auto-update
        name: WARP file auto-update
        entry: powershell.exe
        args: [-ExecutionPolicy, Bypass, -File, scripts/PreCommit-WarpUpdate-Simple.ps1]
        language: system
        files: ^(bin/.*\.py|pyproject\.toml|requirements\.txt)$
        pass_filenames: false
        stages: [pre-commit]

# Global settings
default_language_version:
  python: python3.9

exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      __pycache__/|
      build/|
      dist/
  )$