<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Régulation de température du CANON et de la SECTION</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #e0e0e0;
      margin: 20px;
      padding: 0;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.2rem;
    }

    /* Top container holding the three colored blocks side by side */
    .status-container {
      display: flex;
      justify-content: center;
      gap: 30px; /* Space between the columns */
      margin-bottom: 20px;
    }

    /* Each column of statuses */
    .status-block {
      display: flex;
      flex-direction: column;
      width: 180px;
      border: 1px solid #999;
      background-color: #ccc;
    }

    /* Each colored label */
    .status-line {
      text-align: center;
      padding: 10px;
      font-weight: bold;
      color: #fff;
      border-bottom: 1px solid #999;
    }

    /* Last status line in each block doesn’t need a bottom border */
    .status-block .status-line:last-child {
      border-bottom: none;
    }

    /* Color classes */
    .red {
      background-color: #cc0000;
    }
    .green {
      background-color: #008000;
    }
    .orange {
      background-color: #ff8c00;
    }

    /* Temperature control row */
    .temperature-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .temperature-controls button {
      padding: 6px 12px;
      cursor: pointer;
    }

    .temperature-controls span {
      font-weight: bold;
    }

    /* Bottom buttons (MARCHE / ARRET) */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
    }

    .buttons button {
      padding: 10px 20px;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Régulation de température du CANON et de la SECTION</h1>

<!-- Top row: colored status blocks -->
<div class="status-container">
  <!-- Left block -->
  <div class="status-block">
    <div class="status-line red">CANON Secteur 220V</div>
    <div class="status-line green">CANON AUCUN DEFAUT</div>
    <div class="status-line orange">RESISTIVITE</div>
  </div>

  <!-- Middle block -->
  <div class="status-block">
    <div class="status-line red">SECTION Secteur 220V</div>
    <div class="status-line green">SECTION PRESSOSTAT</div>
    <div class="status-line orange">SECTION DEBITMETRE</div>
  </div>

  <!-- Right block -->
  <div class="status-block">
    <div class="status-line red">SECTION Secteur 220V</div>
    <div class="status-line green">SECTION AUCUN DEFAUT</div>
    <div class="status-line orange">VANNE SECTION FERMEE</div>
  </div>
</div>

<!-- Middle row: arrow buttons and temperature readings -->
<div class="temperature-controls">
  <button>&laquo;</button>
  <button>&raquo;</button>
  <span>T° CANON: 21,0 °C, 10,0 °C</span>
  <button>&laquo;</button>
  <button>&raquo;</button>
  <span>T° SECTION: 27,9 °C, 9,9 °C</span>
</div>

<!-- Bottom row: MARCHE / ARRET -->
<div class="buttons">
  <button>MARCHE</button>
  <button>ARRET</button>
</div>

</body>
</html>
