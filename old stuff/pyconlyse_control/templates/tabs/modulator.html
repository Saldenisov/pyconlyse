<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modulateur Control Page</title>
  <style>
    /* Overall page background and font settings */
    body {
      background-color: #999;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* Container for the entire Modulateur panel */
    .modulateur-container {
      background-color: #bfbfbf; /* Lighter gray for the panel */
      width: 320px;
      padding: 20px;
      border: 1px solid #777;
      margin: 0 auto; /* Center horizontally */
    }

    /* Title at the top */
    .modulateur-title {
      text-align: center;
      color: #000080; /* Dark blue */
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    /* Each row: label (diode), diode indicator, M button, center label, A button */
    .control-row {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }

    /* Left label for the diode */
    .diode-label {
      width: 60px;
      font-weight: bold;
      color: #000080; /* Dark blue, matching title color */
      text-align: right;
      margin-right: 10px;
    }

    /* Diode indicator: small green rectangle */
    .diode-indicator {
      width: 20px;
      height: 40px;
      background-color: #008000; /* Green */
      margin-right: 10px;
      border: 1px solid #666;
    }

    /* “M” (Marche) and “A” (Arrêt) buttons */
    .mode-btn {
      width: 45px;
      height: 40px;
      margin-right: 10px;
      font-weight: bold;
      border: 1px solid #555;
      background: linear-gradient(to bottom, #d9d9d9, #999);
      box-shadow: inset 1px 1px 2px rgba(255,255,255,0.8);
      cursor: pointer;
    }

    /* The label in the middle (e.g., GENERAL, CHAUFFAGE) */
    .mode-label {
      flex: 1; /* Expand to fill available space */
      text-align: center;
      color: #000080; /* Dark blue */
      font-weight: bold;
      text-transform: uppercase;
    }

    /* RESET button at the bottom */
    .reset-btn {
      display: block;
      width: 100%;
      margin-top: 20px;
      padding: 10px 0;
      font-weight: bold;
      border: 1px solid #555;
      background: linear-gradient(to bottom, #d9d9d9, #999);
      box-shadow: inset 1px 1px 2px rgba(255,255,255,0.8);
      cursor: pointer;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

<!-- Main container for the Modulateur section -->
<div class="modulateur-container">
  <div class="modulateur-title">Modulateur</div>

  <!-- Row 1 -->
  <div class="control-row">
    <div class="diode-label">Diode</div>
    <div class="diode-indicator"></div>
    <button class="mode-btn" title="Marche">M</button>
    <div class="mode-label">General</div>
    <button class="mode-btn" title="Arrêt">A</button>
  </div>

  <!-- Row 2 -->
  <div class="control-row">
    <div class="diode-label">Diode</div>
    <div class="diode-indicator"></div>
    <button class="mode-btn" title="Marche">M</button>
    <div class="mode-label">Chauffage</div>
    <button class="mode-btn" title="Arrêt">A</button>
  </div>

  <!-- Row 3 -->
  <div class="control-row">
    <div class="diode-label">Diode</div>
    <div class="diode-indicator"></div>
    <button class="mode-btn" title="Marche">M</button>
    <div class="mode-label">Prema</div>
    <button class="mode-btn" title="Arrêt">A</button>
  </div>

  <!-- Row 4 -->
  <div class="control-row">
    <div class="diode-label">Diode</div>
    <div class="diode-indicator"></div>
    <button class="mode-btn" title="Marche">M</button>
    <div class="mode-label">Focales</div>
    <button class="mode-btn" title="Arrêt">A</button>
  </div>

  <!-- Row 5 -->
  <div class="control-row">
    <div class="diode-label">Diode</div>
    <div class="diode-indicator"></div>
    <button class="mode-btn" title="Marche">M</button>
    <div class="mode-label">Relais HT</div>
    <button class="mode-btn" title="Arrêt">A</button>
  </div>

  <!-- RESET button -->
  <button class="reset-btn">Reset</button>
</div>

</body>
</html>
